name: Integrated agent proof

on:
  pull_request:
  push:
    branches: [feat/desktop-exact-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: integrated-${{ matrix.os }}-1.98.1
      - name: Full repository gates including bootstrap and adversarial pipe fixtures
        run: |
          just ci
          just docs-contract-test
      - name: Install exact provider only in disposable runner tools
        run: npm install --prefix "$RUNNER_TEMP/herdr-codex-provider" --ignore-scripts --no-audit --no-fund @openai/codex@0.154.0
      - name: Linux original baseline (separate experiment control)
        if: runner.os == 'Linux' && github.repository == 'bfirestone/herdr' && github.ref == 'refs/heads/feat/desktop-exact-delivery'
        run: python3 scripts/ci_codex_sandbox.py baseline
      - name: Preview exact disposable Linux runtime and rollback
        if: runner.os == 'Linux' && github.repository == 'bfirestone/herdr' && github.ref == 'refs/heads/feat/desktop-exact-delivery'
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,RUNNER_TEMP /usr/bin/python3 scripts/ci_codex_sandbox.py plan
      - name: Apply exact owned Linux runtime
        id: linux_runtime
        if: runner.os == 'Linux' && github.repository == 'bfirestone/herdr' && github.ref == 'refs/heads/feat/desktop-exact-delivery'
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,RUNNER_TEMP /usr/bin/python3 scripts/ci_codex_sandbox.py apply
      - name: Nonroot Linux candidate descriptor and enforcement fixtures
        if: runner.os == 'Linux' && steps.linux_runtime.outcome == 'success'
        run: python3 scripts/ci_codex_sandbox.py candidate
      - name: Verify Linux runtime and repeat preview without drift
        if: runner.os == 'Linux' && steps.linux_runtime.outcome == 'success'
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,RUNNER_TEMP /usr/bin/python3 scripts/ci_codex_sandbox.py verify
          sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,RUNNER_TEMP /usr/bin/python3 scripts/ci_codex_sandbox.py plan
      - name: Always restore only the owned Linux runtime
        if: always() && runner.os == 'Linux' && steps.linux_runtime.outcome != 'skipped' && steps.linux_runtime.outcome != ''
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,RUNNER_TEMP /usr/bin/python3 scripts/ci_codex_sandbox.py cleanup
      - name: Shipped native and npm launcher descriptor fixtures without model sampling
        if: runner.os != 'Linux' || github.repository != 'bfirestone/herdr' || github.ref != 'refs/heads/feat/desktop-exact-delivery'
        # These fixtures use a stop-only owned SessionStart hook. Live text and
        # permission qualification is a separate opt-in local command, never CI.
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import uuid
          tools = Path(os.environ['RUNNER_TEMP']) / 'herdr-codex-provider/node_modules/@openai'
          native = list(tools.glob('codex-*/vendor/*/bin/codex'))
          assert len(native) == 1, 'exactly one platform-native provider is required'
          wrapper = tools / 'codex/bin/codex.js'
          failures = []
          for name, provider in [('native', native[0]), ('npm', wrapper)]:
              nonce = uuid.uuid4().hex
              result = subprocess.run([
                  'python3', 'scripts/test_integrated_codex.py', '--provider-fixtures-only',
                  '--session', 'codex-proof-' + nonce,
                  '--scratch', str(Path(tempfile.gettempdir()).resolve() / ('herdr-codex-' + nonce)),
                  '--provider-path', str(provider.resolve()),
                  '--herdr-bin', str(Path('target/debug/herdr').resolve()),
              ] + (['--diagnose-provider-runtime'] if os.uname().sysname == 'Linux' else []), check=False)
              if result.returncode:
                  failures.append(name)
          assert not failures, 'unverified provider fixtures: ' + ', '.join(failures)
          PY
      - name: Install exact Claude only in disposable runner tools
        run: npm install --prefix "$RUNNER_TEMP/herdr-claude-provider" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.276
      - name: Claude native and shipped npm fallback hook and MCP descriptors
        # No model request, login, API key or production settings. The native
        # process and each real hook/MCP child are observed separately from Codex.
        run: |
          python3 - <<'CLAUDE_PY'
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          import uuid
          tools = Path(os.environ['RUNNER_TEMP']) / 'herdr-claude-provider/node_modules/@anthropic-ai'
          system = {'Darwin': 'darwin', 'Linux': 'linux'}[platform.system()]
          cpu = {'arm64': 'arm64', 'aarch64': 'arm64', 'x86_64': 'x64'}[platform.machine()]
          native = tools / ('claude-code-' + system + '-' + cpu) / 'claude'
          wrapper = tools / 'claude-code/cli-wrapper.cjs'
          assert native.is_file() and wrapper.is_file()
          node = shutil.which('node')
          assert node
          support = Path(tempfile.mkdtemp(prefix='hx-cl-', dir='/tmp')).resolve()
          launcher = support / 'claude-npm-fallback'
          launcher.write_text('#!' + sys.executable + '\nimport os,sys\nos.execv(' + repr(node)
              + ', [' + repr(node) + ', ' + repr(str(wrapper)) + ', *sys.argv[1:]])\n')
          launcher.chmod(0o700)
          failures = []
          for name, provider in [('native', native), ('npm-fallback', launcher)]:
              nonce = uuid.uuid4().hex
              env = os.environ.copy()
              env['CLAUDE_CONFIG_DIR'] = str(support / (name + '-config'))
              result = subprocess.run([
                  sys.executable, 'scripts/test_integrated_claude.py', '--descriptor-probe-only',
                  '--session', 'claude-proof-' + nonce,
                  '--scratch', str(Path(tempfile.gettempdir()).resolve() / ('herdr-claude-' + nonce)),
                  '--provider-path', str(provider.resolve()),
              ], env=env, check=False)
              if result.returncode:
                  failures.append(name)
          assert not failures, 'unverified Claude descriptors: ' + ', '.join(failures)
          CLAUDE_PY
